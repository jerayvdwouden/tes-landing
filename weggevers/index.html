<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8"><title>Gratis weggevers — The Execution System</title>
<script>
// /weggevers/?w=<slug>&ref=ig  →  /?ref=ig#weggever=<slug>   (de deellink vanuit Instagram e.d.)
// /weggevers/                   →  /#weggevers
var q=new URLSearchParams(location.search), w=(q.get('w')||'').replace(/[^a-z0-9-]/gi,''); q.delete('w');
var rest=q.toString(); location.replace('/'+(rest?'?'+rest:'')+(w?'#weggever='+w:'#weggevers'));
</script></head><body style="background:#0A0A0A"></body></html>
